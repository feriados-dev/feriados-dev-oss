services:
  postgres:
    image: postgres:16-alpine
    container_name: feriados-postgres
    environment:
      POSTGRES_DB: feriados
      POSTGRES_USER: feriados
      POSTGRES_PASSWORD: feriados
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feriados-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://feriados:feriados@postgres:5432/feriados
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command: sh -c "npm run migrate && npm start"

volumes:
  postgres_data:
