name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npx jest --runInBand --coverage=false

      - name: Migration dry-run
        run: npm run migrate -- --dry-run

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install smoke dependencies
        run: npm ci

      - name: Build and start Docker stack
        run: docker compose up --build -d

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs api postgres
          exit 1

      - name: Smoke test
        run: npm run smoke

      - name: Docker logs on failure
        if: failure()
        run: docker compose logs api postgres

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v
